"round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h13l-3-3M20 17H7l3 3"></path></svg></sc-if><sc-if value="{{isOk}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span><div style="display:flex;flex-direction:column;gap:2px"><b style="font-size:18px;font-weight:600;line-height:1.3">{{stTitle}}</b><span style="font-size:14px;opacity:.92;line-height:1.45">{{stSub}}</span></div></div><div style="padding:16px;display:flex;gap:14px;align-items:center"><div style="width:62px;height:66px;border-radius:14px;border:1.5px solid #E1E7F2;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;overflow:hidden"><span style="font-size:12px;font-weight:600;width:100%;text-align:center;padding:2px 0;color:#fff;{{calHead}}">ธ.ค.</span><span style="font-size:26px;font-weight:600;line-height:1.2;{{dateSt}}">{{day}}</span></div><div style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0"><span class="muted" style="font-size:13px">{{dateLbl}}</span><sc-if value="{{isChanged}}" hint-placeholder-val="{{false}}"><span style="font-size:14px;color:#8A94AD;text-decoration:line-through">พฤหัสบดี 17 ธ.ค. 2569</span></sc-if><b style="font-size:18px;font-weight:600;{{dateSt}}">{{dateText}}</b></div></div><div style="margin:0 16px;border-top:1px dashed #D5DDEA"></div><div style="padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:15px"><span class="row" style="gap:10px"><span style="color:#5A6585;display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-6.1-6.5-11a6.5 6.5 0 0 1 13 0c0 4.9-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg></span>รพ.สต.บ้า ht:38px;border-radius:10px;font-size:13px;border:1px solid #D5DDEA;background:#fff;color:#5A6585;display:flex;align-items:center;justify-content:center;text-decoration:none">ยืนยันแล้ว →</a></div></div></main><footer style="background:#fff;border-radius:24px 24px 0 0;padding:14px 16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -4px 16px rgba(20,33,90,.06)"><sc-if value="{{isChanged}}" hint-placeholder-val="{{false}}"><a class="btn btn-primary" href="Line-QR.html">ยืนยันวันนัดใหม่</a><a class="btn" href="tel:042123456" style="background:#fff;border:1.5px solid #D5DDEA;color:#14215A;text-decoration:none">ไม่สะดวก ติดต่อเจ้าหน้าที่</a></sc-if><sc-if value="{{notChanged}}" hint-placeholder-val="{{true}}"><a class="btn" href="Line-Appts-Booked.html" style="background:#fff;border:1.5px solid #D5DDEA;color:#14215A;text-decoration:none">กลับหน้าการนัดหมาย</a></sc-if></footer>

<script>mountDC(document.getElementById('app'),document.getElementById('tpl').textContent,"\nclass Component extends DCLogic {\nrenderVals() {\n  const s = this.state || {};\n  const st = s.st ?? (this.props.status || 'wait');\n  const T = {wait: ['\u0e2a\u0e48\u0e07\u0e04\u0e33\u0e02\u0e2d\u0e41\u0e25\u0e49\u0e27 \u0e23\u0e2d\u0e40\u0e08\u0e49\u0e32\u0e2b\u0e19\u0e49\u0e32\u0e17\u0e35\u0e48\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19', '\u0e08\u0e30\u0e2a\u0e48\u0e07 QR \u0e19\u0e31\u0e14\u0e15\u0e23\u0e27\u0e08\u0e17\u0e32\u0e07 LINE \u0e20\u0e32\u0e22\u0e43\u0e19 24 \u0e0a\u0e21.', 'border:1.5px solid #D5DDEA', 'background:#EEF3FF;color:#2F5BEA'],\n    changed: ['\u0e40\u0e08\u0e49\u0e32\u0e2b\u0e19\u0e49\u0e32\u0e17\u0e35\u0e48\u0e02\u0e2d\u0e40\u0e1b\u0e25\u0e35\u0e48\u0e22\u0e19\u0e27\u0e31\u0e19\u0e19\u0e31\u0e14', '\u0e15\u0e23\u0e27\u0e08\u0e2a\u0e2d\u0e1a\u0e27\u0e31\u0e19\u0e43\u0e2b\u0e21\u0e48 \u0e41\u0e25\u0e49\u0e27\u0e01\u0e14\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e14\u0e49\u0e32\u0e19\u0e25\u0e48\u0e32\u0e07', 'border:1.5px solid #F3C98B', 'background:#FFF4E5;color:#B26A00'],\n    ok: ['\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e19\u0e31\u0e14\u0e41\u0e25\u0e49\u0e27', '\u0e41\u0e2a\u0e14\u0e07 QR \u0e19\u0e31\u0e14\u0e15\u0e23\u0e27\u0e08\u0e17\u0e35\u0e48\u0e08\u0e38\u0e14\u0e25\u0e07\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e43\u0e19\u0e27\u0e31\u0e19\u0e15\u0e23\u0e27\u0e08', 'border:1.5px solid #A8D5B5', 'background:#E6F4EA;color:#2E8540']}[st];\n  return {\n    isWait: st === 'wait', isChanged: st === 'changed', isOk: st === 'ok', notChanged: st !== 'changed',\n    stTitle: T[0], stSub: T[1], stBan: {wait: 'background:#2F5BEA;color:#fff', changed: 'background:#E08A1E;color:#fff', ok: 'background:#2E8540;color:#fff'}[st], calHead: {wait: 'background:#2F5BEA', changed: 'background:#E08A1E', ok: 'background:#2E8540'}[st], day: (st === 'changed' || s.moved) ? '19' : '17',\n    dateLbl: st === 'changed' ? '\u0e27\u0e31\u0e19\u0e19\u0e31\u0e14\u0e43\u0e2b\u0e21\u0e48' : st === 'ok' ? '\u0e27\u0e31\u0e19\u0e19\u0e31\u0e14\u0e15\u0e23\u0e27\u0e08' : '\u0e27\u0e31\u0e19\u0e17\u0e35\u0e48\u0e02\u0e2d\u0e15\u0e23\u0e27\u0e08',\n    dateText: (st === 'changed' || s.moved) ? '\u0e28\u0e38\u0e01\u0e23\u0e4c 19 \u0e18.\u0e04. 2569' : '\u0e1e\u0e24\u0e2b\u0e31\u0e2a\u0e1a\u0e14\u0e35 17 \u0e18.\u0e04. 2569', dateSt: st === 'changed' ? 'color:#B26A00' : '',\n    accept: () => this.setState({st: 'ok', moved: true}),\n    sims: [['wait', '\u0e23\u0e2d\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19'], ['changed', '\u0e40\u0e1b\u0e25\u0e35\u0e48\u0e22\u0e19\u0e19\u0e31\u0e14']].map(([id, n]) => ({n, pick: () => this.setState({st: id, moved: id === 'changed' ? true : s.moved}), st: id === st ? 'border:0;background:#2F5BEA;color:#fff;font-weight:600' : 'border:1px solid #D5DDEA;background:#fff;color:#5A6585'})),\n  };\n}\n}\n",{"status": "wait"});</script>
