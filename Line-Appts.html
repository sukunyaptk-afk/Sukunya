<style>
body{margin:0;font-family:'Prompt',system-ui,sans-serif;color:#14215A;background:#F4F6FB}
a{color:#2F5BEA}a:hover{color:#1E3FB0}

.card{background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(20,33,90,.05),0 8px 24px rgba(20,33,90,.06)}

<script>mountDC(document.getElementById('app'),document.getElementById('tpl').textContent,"\nclass Component extends DCLogic {\nrenderVals() {\n  const s = this.state || {};\n  const tab = s.tab ?? 'all'; const kind = s.kind ?? 'hc';\n  const T = [\n    {id: 'all', n: '\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14', sym: '\u25a6', ic: 'background:#5A6585;color:#fff'},\n    {id: 'wait', n: '\u0e23\u0e2d\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19', sym: '\u23f3', ic: 'background:#FFF4E5;color:#B26A00'},\n    {id: 'ok', n: '\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e41\u0e25\u0e49\u0e27', sym: '\u2713', ic: 'background:#E6F4EA;color:#2E8540;font-weight:700'},\n    {id: 'done', n: '\u0e15\u0e23\u0e27\u0e08\u0e41\u0e25\u0e49\u0e27', sym: '\u2714', ic: 'background:#EEF3FF;color:#2F5BEA'},\n    {id: 'cancel', n: '\u0e22\u0e01\u0e40\u0e25\u0e34\u0e01', sym: '\u2715', ic: 'background:#FDECEC;color:#C62828'},\n  ];\n  const ST = {wait: ['\u0e23\u0e2d\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19', 'background:#FFF4E5;color:#B26A00', 'background:#E8A23A'], ok: ['\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e41\u0e25\u0e49\u0e27', 'background:#E6F4EA;color:#23683A', 'background:#2E8540'], done: ['\u0e15\u0e23\u0e27\u0e08\u0e41\u0e25\u0e49\u0e27', 'background:#EEF3FF;color:#2F5BEA', 'background:#2F5BEA']};\n  const A = [\n    {k: 'hc', upcoming: true, st: 'wait', title: '\u0e15\u0e23\u0e27\u0e08\u0e2a\u0e38\u0e02\u0e20\u0e32\u0e1e \u00b7 Basic', sub: '\u0e23\u0e1e.\u0e2a\u0e15.\u0e1a\u0e49\u0e32\u0e19\u0e2b\u0e19\u0e2d\u0e07\u0e1a\u0e31\u0e27', date: '\u0e27\u0e31\u0e19\u0e17\u0e35\u0e48: 17 \u0e18.\u0e04. 2569', time: '\u0e0a\u0e48\u0e27\u0e07\u0e40\u0e0a\u0e49\u0e32 08:00 \u2013 12:00 \u0e19.', type: '\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e27\u0e31\u0e22 60 \u0e1b\u0e35\u0e02\u0e36\u0e49\u0e19\u0e44\u0e1b \u00b7 13 \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23', av: 'background:#F1ECFB;color:#6B3FC4', sym: '\u2665'},\n    {k: 'new', st: 'done', title: '\u0e44\u0e21\u0e48\u0e23\u0e30\u0e1a\u0e38\u0e41\u0e1e\u0e17\u0e22\u0e4c', sub: '\u0e41\u0e1c\u0e19\u0e01 / \u0e04\u0e25\u0e34\u0e19\u0e34\u0e01: \u2013', date: '\u0e27\u0e31\u0e19\u0e17\u0e35\u0e48: 22 \u0e1e.\u0e22. 2569', time: '\u0e40\u0e27\u0e25\u0e32 13:20 \u2013 13:30 \u0e19.', type: '\u0e15\u0e23\u0e27\u0e08\u0e43\u0e2b\u0e21\u0e48', av: 'background:#E4E8F0;color:#8A94AD', sym: '\u25cf'},\n    {k: 'new', st: 'ok', title: '\u0e1e\u0e0d.\u0e2a\u0e38\u0e14\u0e32 \u0e43\u0e08\u0e07\u0e32\u0e21', sub: '\u0e04\u0e25\u0e34\u0e19\u0e34\u0e01\u0e2d\u0e32\u0e22\u0e38\u0e23\u0e01\u0e23\u0e23\u0e21', date: '\u0e27\u0e31\u0e19\u0e17\u0e35\u0e48: 2 \u0e18.\u0e04. 2569', time: '\u0e40\u0e27\u0e25\u0e32 09:00 \u2013 09:15 \u0e19.', type: '\u0e15\u0e23\u0e27\u0e08\u0e43\u0e2b\u0e21\u0e48 \u00b7 Telemed', av: 'background:#EEF3FF;color:#2F5BEA', sym: '\u25cf'},\n  ];\n  const has = this.props.hasItems ?? true; const booked = this.props.booked ?? false;\n  const list = (has ? A : []).filter((a) => (booked || !a.upcoming) && a.k === kind && (tab === 'all' || a.st === tab)).map((a) => ({...a, status: ST[a.st][0], chip: ST[a.st][1], bar: ST[a.st][2]}));\n  return {\n    uname: '\u0e2a\u0e21\u0e0a\u0e32\u0e22 \u0e43\u0e08\u0e14\u0e35', initial: '\u0e2a', welcome: !s.seen,\n    tabs: T.map((t) => ({...t, pick: () => this.setState({tab: t.id, seen: true}), st: t.id === tab ? 'border:2px solid #5A6585;box-shadow:inset 0 -4px 0 #5A6585' : 'border:1.5px solid #E1E7F2'})),\n    items: list, count: list.length, dis: kind === 'new', dimSt: kind === 'new' ? 'opacity:.5;filter:grayscale(1);pointer-events:none;user-select:none' : '',\n    kinds: [['hc', '\u0e25\u0e07\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e15\u0e23\u0e27\u0e08\u0e2a\u0e38\u0e02\u0e20\u0e32\u0e1e'], ['new', '\u0e19\u0e31\u0e14\u0e2b\u0e21\u0e32\u0e22\u0e15\u0e23\u0e27\u0e08\u0e43\u0e2b\u0e21\u0e48']].map(([id, n]) => ({n, pick: () => this.setState({kind: id, tab: 'all'}), st: id === kind ? 'background:#fff;color:' + (id === 'hc' ? '#6B3FC4' : '#2F5BEA') + ';font-weight:600;box-shadow:0 1px 4px rgba(20,33,90,.12)' : 'background:transparent;color:#5A6585'})),\n    addHref: kind === 'hc' ? '#' : '#', addClick: (e) => { if (kind === 'hc') { e && e.preventDefault && e.preventDefault(); this.setState({sheet: true}); } }, sheet: !!s.sheet, closeSheet: () => this.setState({sheet: false}), addLbl: kind === 'hc' ? '\u0e25\u0e07\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e15\u0e23\u0e27\u0e08\u0e2a\u0e38\u0e02\u0e20\u0e32\u0e1e' : '\u0e19\u0e31\u0e14\u0e2b\u0e21\u0e32\u0e22\u0e15\u0e23\u0e27\u0e08\u0e43\u0e2b\u0e21\u0e48',\n    addBg: kind === 'hc' ? 'linear-gradient(135deg,#7A4FD6,#5B3BB8)' : 'linear-gradient(135deg,#3D6BF0,#2449C4)', addFg: kind === 'hc' ? '#6B3FC4' : '#2F5BEA', empty: list.length === 0,\n  };\n}\n}\n",{"hasItems": true, "booked": false});</script>
