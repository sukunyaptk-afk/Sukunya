<style>
body{margin:0;font-family:'Prompt',system-ui,sans-serif;color:#14215A;background:#F4F6FB}
a{color:#2F5BEA}a:hover{color:#1E3FB0}

</head><body><div id="app"></div><a class="proto-home" href="screens.html">☰ ทุกหน้าจอ</a>
<script id="tpl" type="text/plain">

<div style="width:390px;height:844px;background:#F4F6FB;display:flex;flex-direction:column;overflow:hidden;position:relative">
<header style="flex:none;display:flex;flex-direction:column"><div style="background:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E6EAF2"><span class="row" style="gap:8px"><img src="assets/drassist-symbol.png" alt="" width="32" height="32" style="display:block"><b style="font-size:19px;color:#2F5BEA;font-weight:600">Dr.Assist</b></span><span class="row" style="gap:10px"><span style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.25"><span style="font-size:14px;font-weight:500">สมชาย ใจดี</span><span class="chip" style="background:#EEF3FF;color:#2F5BEA;font-size:12px;padding:1px 8px">ผู้ป่วย</span></span><span style="width:40px;height:40px;border-radius:12px;background:#EEF3FF;border:1.5px solid #D5E0F7;color:#2F5BEA;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px">ส</span></span></div><div style="padding:10px 16px 0;display:flex;flex-direction:column;gap:10px"><a href="Line-Pkg.html" class="row" style="gap:6px;text-decoration:none;color:#2F5BEA;font-size:17px;font-weight:500;align-self:flex-start;min-height:36px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>ย้อนกลับ</a><div class="card" style="padding:12px 16px;display:flex;flex-direction:column;gap:8px"><span class="row" style="justify-content:space-between"><b style="font-size: 16px; font-weight: 600">ขั้นตอนที่ 2&nbsp;</b><span style="font-size: 14px; color: rgb(47, 91, 234); font-weight: 500">เลือกสถานที่และวันที่</span></span><div style="display:flex;gap:6px"><span style="flex:1;height:6px;border-radius:3px;background:#2F5BEA"></span><span style="flex:1;height:6px;border-radius:3px;background:#2F5BEA"></span><span style="flex:1;height:6px;border-radius:3px;background:#E1E7F2"></span></div></div></div></header>
<main style="flex:1;min-height:0;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px">
<section style="display:flex;flex-direction:column;gap:6px"><h2 style="margin:0;font-size:16px;font-weight:600">เลือกสถานที่ตรวจ <span class="req">*</span></h2>
<div style="position:relative;display:flex;flex-direction:column;gap:6px"><button type="button" aria-haspopup="listbox" aria-expanded="{{open}}" onClick="{{toggle}}" style="font:inherit;text-align:left;cursor:pointer;width:100%;min-height:52px;padding:6px 12px;display:flex;align-items:center;gap:12px;color:#14215A;background:#fff;border-radius:16px;{{ddSt}}"><span class="tile" style="width:36px;height:36px;background:#EEF3FF;color:#2F5BEA"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-6.1-6.5-11a6.5 6.5 0 0 1 13 0c0 4.9-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg></span><span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size: 16px; font-weight: 600; line-height: 1.35">{{hName}}</span></span><span style="width:32px;height:32px;border-radius:50%;background:#F1F4FA;display:flex;align-items:center;justify-content:center;color:#14215A;flex:none;{{chevSt}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></button><sc-if value="{{open}}" hint-placeholder-val="{{false}}"><div class="card" role="listbox" style="padding:6px;display:flex;flex-direction:column;gap:2px;border:1.5px solid #D5DDEA"><sc-for list="{{hosp}}" as="h" hint-placeholder-count="3"><button type="button" role="option" aria-selected="{{h.on}}" onClick="{{h.pick}}" style="font:inherit;text-align:left;cursor:pointer;width:100%;min-height:58px;padding:8px 12px;display:flex;align-items:center;gap:10px;color:#14215A;border:0;border-radius:12px;{{h.st}}"><span style="flex:1;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:600;line-height:1.35">{{h.name}}</span><span class="muted" style="font-size:14px">{{h.sub}}</span></span><sc-if value="{{h.on}}" hint-placeholder-val="{{false}}"><span style="color:#2F5BEA;display:flex;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if></button></sc-for></div></sc-if></div></section>
<section class="card" style="padding:10px 12px;display:flex;flex-direction:column;gap:6px">
<div class="row" style="justify-content:space-between"><button type="button" aria-label="เดือนก่อนหน้า" style="width:36px;height:36px;border-radius:50%;border:0;background:#F1F4FA;display:flex;align-items:center;justify-content:center;color:#B6BDCC"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><h2 style="margin:0;font-size:18px;font-weight:600">ธันวาคม 2569</h2><button type="button" aria-label="เดือนถัดไป" style="width:36px;height:36px;border-radius:50%;border:0;background:#F1F4FA;display:flex;align-items:center;justify-content:center;color:#14215A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button></div>
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px"><div style="text-align:center;font-size:14px;font-weight:500;color:#C62828">อา</div><div style="text-align:center;font-size:14px;font-weight:500;color:#5A6585">จ</div><div style="text-align:center;font-size:14px;font-weight:500;color:#5A6585">อ</div><div style="text-align:center;font-size:14px;font-weight:500;color:#5A6585">พ</div><div style="text-align:center;font-size:14px;font-weight:500;color:#5A6585">พฤ</div><div style="text-align:center;font-size:14px;font-weight:500;color:#5A6585">ศ</div><div style="text-align:center;font-size:14px;font-weight:500;color:#C62828">ส</div>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="33"><sc-if value="{{c.blank}}" hint-placeholder-val="{{false}}"><div></div></sc-if><sc-if value="{{c.show}}" hint-placeholder-val="{{true}}"><button type="button" style="{{c.st}}" disabled="{{c.dis}}" onClick="{{c.pick}}">{{c.d}}</button></sc-if></sc-for></div>
<div class="row" style="gap:14px;font-size:13px;color:#5A6585;justify-content:center;flex-wrap:wrap"><span class="row" style="gap:6px"><span style="width:12px;height:12px;border-radius:4px;background:#EAF6EC;border:1.5px solid #8CCB98"></span>ว่าง</span><span class="row" style="gap:6px"><span style="width:12px;height:12px;border-radius:4px;background:#FDECEC"></span>เต็ม (ครบ 50 คน)</span><span class="row" style="gap:6px"><span style="width:12px;height:12px;border-radius:4px;background:#E9ECF2"></span>ปิด</span></div></section>
<section class="card" style="padding:10px 14px;display:flex;flex-direction:column;gap:6px"><div class="row" style="justify-content:space-between;gap:10px"><span style="font-size:16px;font-weight:600">{{selText}}</span><span class="chip" style="background:#E6F4EA;color:#23683A">ว่าง {{left}} ที่</span></div>
<div style="height:8px;background:#EDF0F5;border-radius:4px;overflow:hidden"><div style="{{barSt}}"></div></div><span class="muted" style="font-size:14px">จองแล้ว {{bk}} จาก {{cap}} คน · ไม่ต้องเลือกเวลา</span></section>
</main>
<footer style="background:#fff;border-radius:24px 24px 0 0;padding:14px 16px 18px;display:flex;gap:10px;box-shadow:0 -4px 16px rgba(20,33,90,.06)"><a class="btn btn-primary" href="Line-Summary.html" style="flex:1">ถัดไป</a></footer>
</div>
</script>

<script>mountDC(document.getElementById('app'),document.getElementById('tpl').textContent,"\nclass Component extends DCLogic {\nrenderVals() {\n  const H = [{\"id\": \"h1\", \"name\": \"\u0e23\u0e1e.\u0e2a\u0e15.\u0e1a\u0e49\u0e32\u0e19\u0e2b\u0e19\u0e2d\u0e07\u0e1a\u0e31\u0e27\", \"sub\": \"\u0e23\u0e1e.\u0e2a\u0e15. \u00b7 1.2 \u0e01\u0e21.\"}, {\"id\": \"h2\", \"name\": \"\u0e23\u0e1e.\u0e2a\u0e15.\u0e1a\u0e49\u0e32\u0e19\u0e42\u0e19\u0e19\u0e2a\u0e39\u0e07\", \"sub\": \"\u0e23\u0e1e.\u0e2a\u0e15. \u00b7 3.8 \u0e01\u0e21.\"}, {\"id\": \"h3\", \"name\": \"\u0e42\u0e23\u0e07\u0e1e\u0e22\u0e32\u0e1a\u0e32\u0e25\u0e17\u0e31\u0e48\u0e27\u0e44\u0e1b\u0e02\u0e19\u0e32\u0e14\u0e43\u0e2b\u0e0d\u0e48\u0e01\u0e25\u0e49\u0e27\u0e22\u0e19\u0e49\u0e33\u0e44\u0e17\", \"sub\": \"\u0e42\u0e23\u0e07\u0e1e\u0e22\u0e32\u0e1a\u0e32\u0e25 \u00b7 \u0e15\u0e32\u0e21\u0e2a\u0e34\u0e17\u0e18\u0e34 \u00b7 9.5 \u0e01\u0e21.\"}]; const BOOK = {\"1\": 31, \"2\": 44, \"3\": 50, \"4\": 22, \"7\": 18, \"8\": 50, \"9\": 39, \"11\": 27, \"14\": 12, \"15\": 47, \"16\": 50, \"17\": 32, \"18\": 20, \"21\": 9, \"22\": 6, \"23\": 15, \"24\": 3, \"25\": 2, \"28\": 1, \"29\": 0, \"30\": 0}; const CLOSED = [5, 10, 31]; const LEAD = 2; const CAP = 50;\n  const WK = ['\u0e2d\u0e32\u0e17\u0e34\u0e15\u0e22\u0e4c','\u0e08\u0e31\u0e19\u0e17\u0e23\u0e4c','\u0e2d\u0e31\u0e07\u0e04\u0e32\u0e23','\u0e1e\u0e38\u0e18','\u0e1e\u0e24\u0e2b\u0e31\u0e2a\u0e1a\u0e14\u0e35','\u0e28\u0e38\u0e01\u0e23\u0e4c','\u0e40\u0e2a\u0e32\u0e23\u0e4c'];\n  const s = this.state || {};\n  const hid = s.h ?? 'h1'; const sel = s.sel ?? 17;\n  const open = !!s.open;\n  const hosp = H.map((h) => ({...h, on: h.id === hid, st: h.id === hid ? 'background:#EEF3FF' : 'background:#fff', pick: () => this.setState({h: h.id, open: false})}));\n  const cells = [];\n  for (let i = 0; i < LEAD; i++) cells.push({blank: true, show: false});\n  for (let d = 1; d <= 31; d++) {\n    const wd = (LEAD + d - 1) % 7; const closed = wd === 0 || wd === 6 || CLOSED.includes(d) || d < 1;\n    const bk = BOOK[d] || 0; const full = !closed && bk >= CAP; const avail = !closed && !full; const isSel = avail && d === sel;\n    let st = 'font:inherit;border:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:42px;font-size:17px;cursor:' + (avail ? 'pointer' : 'default') + ';';\n    if (isSel) st += 'background:#2F5BEA;color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(47,91,234,.35);';\n    else if (avail) st += 'background:#EAF6EC;color:#1F5E2C;font-weight:500;';\n    else if (full) st += 'background:#FDECEC;color:#B42318;';\n    else st += 'background:transparent;color:#B6BDCC;';\n    cells.push({blank: false, show: true, d, st, dis: !avail, full, pick: () => avail && this.setState({sel: d})});\n  }\n  const bk = BOOK[sel] || 0; const h = H.find((x) => x.id === hid);\n  return { done: !!s.done, reg: () => this.setState({done: true}), hosp, cells, hName: h.name, hSub: h.sub, open, toggle: () => this.setState({open: !open}), ddSt: open ? 'border:2px solid #2F5BEA;box-shadow:0 0 0 4px rgba(47,91,234,.15)' : 'border:2px solid #D5DDEA', chevSt: open ? 'transform:rotate(180deg)' : '', selText: '\u0e27\u0e31\u0e19' + WK[(LEAD + sel - 1) % 7] + ' ' + sel + ' \u0e18.\u0e04. 2569', left: CAP - bk, cap: CAP, bk,\n    barSt: 'width:' + Math.round(bk / CAP * 100) + '%;height:100%;background:' + (CAP - bk <= 5 ? '#E08A1E' : '#2E8540') + ';border-radius:4px' };\n}\n}\n",{});</script>
