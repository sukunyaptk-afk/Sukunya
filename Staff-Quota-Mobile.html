<style>
body{margin:0;font-family:'Prompt',system-ui,sans-serif;color:#14215A;background:#F4F6FB}

<script id="tpl" type="text/plain">

<div style="width:390px;height:844px;background:#F4F6FB;display:flex;flex-direction:column;overflow:hidden">
<div style="width:390px;height:844px;background:#F4F6FB;display:flex;flex-direction:column;overflow:hidden;position:relative"><header style="flex:none;background:#14215A;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between"><span class="row" style="gap:10px"><img src="assets/drassist-symbol.png" alt="" width="32" height="32" style="display:block;background:#fff;border-radius:8px;padding:2px"><span style="display:flex;flex-direction:column;line-height:1.25"><b style="font-size:16px;font-weight:600">Dr.Assist · เจ้าหน้าที่</b><span style="font-size:12px;opacity:.8">ตั้งค่าโควตาคิวตรวจสุขภาพ</span></span></span><span style="width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:600">วภ</span></header><main style="flex:1;min-height:0;overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;gap:4px;background:#E9EDF5;border-radius:16px;padding:4px"><button type="button" onClick="{{toWeek}}" style="{{segW}}">รายสัปดาห์</button><button type="button" onClick="{{toDay}}" style="{{segD}}">รายวัน</button></div><sc-if value="{{isWeek}}" hint-placeholder-val="{{true}}"><section class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:4px"><div style="display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr;gap:8px;font-size:12px;color:#8A94AD;padding:0 2px"><span>วัน</span><span style="text-align:center">เช้า</span><span style="text-align:center">บ่าย</span><span style="text-align:right">รวม</span></div><sc-for list="{{weekRows}}" as="w" hint-placeholder-count="7"><div style="display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #EEF1F6;{{w.rowSt}}"><button type="button" onClick="{{w.toggle}}" style="font:inherit;border:0;background:none;padding:0;display:flex;align-items:center;gap:8px;cursor:pointer;color:#14215A;text-align:left"><span style="width:36px;height:22px;border-radius:999px;position:relative;flex:none;{{w.sw}}"><span style="position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;{{w.knob}}"></span></span><span style="font-size:14px">{{w.name}}</span></button><input class="inp" type="number" inputmode="numeric" value="{{w.am}}" onChange="{{w.setAm}}" style="height:44px;text-align:center;padding:0 6px"><input class="inp" type="number" inputmode="numeric" value="{{w.pm}}" onChange="{{w.setPm}}" style="height:44px;text-align:center;padding:0 6px"><b style="text-align:right;font-size:15px;font-weight:600">{{w.total}}</b></div></sc-for><div class="row" style="justify-content:space-between;padding-top:8px;border-top:1px solid #EEF1F6"><span class="muted" style="font-size:14px">รวมต่อสัปดาห์</span><b style="font-size:18px;font-weight:600;color:#2F5BEA">{{weekTotal}} คิว</b></div></section><div class="row" style="gap:8px;background:#EEF3FF;border-radius:12px;padding:10px 12px;font-size:13px;color:#24408F;align-items:flex-start"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg><span>ค่าตั้งต้นใช้กับทุกสัปดาห์ ปรับเฉพาะบางวันได้ที่แท็บ "รายวัน"</span></div></sc-if><sc-if value="{{isDay}}" hint-placeholder-val="{{false}}"><section class="card" style="padding:10px;display:flex;flex-direction:column;gap:6px"><b style="font-size:15px;font-weight:600;padding:2px 4px">ธันวาคม 2569</b><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;color:#8A94AD;text-align:center"><span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px"><sc-for list="{{cells}}" as="c" hint-placeholder-count="14"><sc-if value="{{c.blank}}" hint-placeholder-val="{{false}}"><span></span></sc-if><sc-if value="{{c.show}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{c.pick}}" style="{{c.mst}}"><b style="font-size:14px;font-weight:600">{{c.d}}</b><span style="font-size:10px;line-height:1.1;{{c.subSt}}">{{c.sub}}</span></button></sc-if></sc-for></div><div class="row" style="gap:12px;font-size:11px;color:#5A6585;padding:2px 4px;flex-wrap:wrap"><span class="row" style="gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#2E8540"></span>ว่าง</span><span class="row" style="gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#C62828"></span>เต็ม</span><span class="row" style="gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#B26A00"></span>ปรับเฉพาะวัน</span><span class="row" style="gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#C3CAD8"></span>ปิด</span></div></section><section class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:space-between"><b style="font-size:16px;font-weight:600">{{selText}}</b><sc-if value="{{d.custom}}" hint-placeholder-val="{{false}}"><span class="chip" style="background:#FFF4E5;color:#B26A00;font-size:12px">ปรับเฉพาะวัน</span></sc-if></div><button type="button" onClick="{{dToggle}}" style="font:inherit;border:0;background:#F4F6FB;border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:#14215A"><span style="font-size:15px">เปิดรับคิววันนี้</span><span style="width:44px;height:26px;border-radius:999px;position:relative;{{dSw}}"><span style="position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;{{dKnob}}"></span></span></button><sc-if value="{{d.on}}" hint-placeholder-val="{{true}}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label style="display:flex;flex-direction:column;gap:4px"><span class="lbl" style="font-size:13px">ช่วงเช้า (จองแล้ว {{d.bAm}})</span><input class="inp" type="number" inputmode="numeric" value="{{d.am}}" onChange="{{dAm}}" style="height:44px;text-align:center;padding:0 6px;{{amSt}}"></label><label style="display:flex;flex-direction:column;gap:4px"><span class="lbl" style="font-size:13px">ช่วงบ่าย (จองแล้ว {{d.bPm}})</span><input class="inp" type="number" inputmode="numeric" value="{{d.pm}}" onChange="{{dPm}}" style="height:44px;text-align:center;padding:0 6px;{{pmSt}}"></label></div><sc-if value="{{anyLow}}" hint-placeholder-val="{{false}}"><div style="background:#FDECEC;color:#9E1C1C;border-radius:10px;padding:8px 12px;font-size:13px">จำนวนคิวน้อยกว่าที่จองไว้แล้ว กรุณาติดต่อผู้รับบริการเพื่อเลื่อนนัด</div></sc-if><div class="row" style="justify-content:space-between;font-size:14px"><span class="muted">รวม {{d.total}} · จองแล้ว {{d.bTotal}}</span><b style="font-weight:600;color:#2E8540">ว่าง {{d.left}}</b></div></sc-if><input class="inp" placeholder="หมายเหตุ เช่น วันหยุด / เพิ่มคิว" value="{{d.note}}" onChange="{{dNote}}"><sc-if value="{{d.custom}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{dReset}}" style="font:inherit;border:0;background:none;color:#2F5BEA;font-size:14px;cursor:pointer;align-self:flex-start;padding:0">ใช้ค่าตั้งต้นรายสัปดาห์</button></sc-if></section></sc-if></main><footer style="flex:none;background:transparent;padding:8px 16px 40px"><sc-if value="{{isWeek}}" hint-placeholder-val="{{true}}"><button type="button" class="btn btn-primary" onClick="{{saveW}}" style="width:100%">บันทึกค่าตั้งต้น</button></sc-if><sc-if value="{{isDay}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-primary" onClick="{{saveD}}" style="width:100%">บันทึกวันนี้</button></sc-if></footer><nav style="flex:none;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -6px 20px rgba(20,33,90,.08);display:flex;align-items:flex-start;height:78px;padding:0 6px 10px;position:relative;z-index:6"><a href="Staff-Home-Mobile.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8A94AD;font-size:12px;font-weight:400;padding-top:12px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"></path></svg>หน้าแรก</a><a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8A94AD;font-size:12px;font-weight:400;padding-top:12px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>ประวัติ</a><a href="Staff-Station-Mobile.html" aria-label="สแกน QR" style="flex:1;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#14215A;font-size:12px;font-weight:600;gap:4px"><span style="width:70px;height:70px;margin-top:-30px;border-radius:50%;background:linear-gradient(135deg,#4B76F5,#2449C4);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(47,91,234,.45),0 0 0 6px #fff"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"></path></svg></span>สแกน</a><a href="Staff-Quota-Mobile.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#2F5BEA;font-size:12px;font-weight:600;padding-top:12px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3M8 17h6"></path></svg>โควตาคิว</a><a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#8A94AD;font-size:12px;font-weight:400;padding-top:12px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>เมนู</a></nav><sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}"><div style="position:absolute;left:12px;right:12px;bottom:96px;background:#14215A;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;z-index:9;box-shadow:0 10px 30px rgba(20,33,90,.3)"><span style="color:#7FD39A;display:flex;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex:1">{{toast}}</span><button type="button" onClick="{{hideToast}}" style="border:0;background:none;color:#fff;font-size:20px;cursor:pointer;line-height:1">×</button></div></sc-if>

<script>mountDC(document.getElementById('app'),document.getElementById('tpl').textContent,"\nclass Component extends DCLogic {\nrenderVals() {\n  const BOOK = {\"1\": [14, 6], \"2\": [18, 8], \"3\": [20, 9], \"4\": [12, 4], \"7\": [9, 3], \"8\": [20, 10], \"9\": [16, 7], \"11\": [11, 5], \"14\": [8, 2], \"15\": [20, 10], \"16\": [19, 6], \"17\": [15, 6], \"18\": [10, 3], \"21\": [6, 1], \"22\": [5, 2], \"23\": [20, 10], \"24\": [4, 0], \"25\": [3, 1], \"28\": [2, 0], \"29\": [1, 0], \"30\": [0, 0]};\n  const OVER0 = {\"5\": {\"on\": false, \"am\": 0, \"pm\": 0, \"note\": \"\u0e27\u0e31\u0e19\u0e2b\u0e22\u0e38\u0e14\u0e23\u0e32\u0e0a\u0e01\u0e32\u0e23\"}, \"10\": {\"on\": false, \"am\": 0, \"pm\": 0, \"note\": \"\u0e27\u0e31\u0e19\u0e2b\u0e22\u0e38\u0e14\u0e23\u0e32\u0e0a\u0e01\u0e32\u0e23\"}, \"31\": {\"on\": false, \"am\": 0, \"pm\": 0, \"note\": \"\u0e27\u0e31\u0e19\u0e2b\u0e22\u0e38\u0e14\u0e23\u0e32\u0e0a\u0e01\u0e32\u0e23\"}, \"17\": {\"on\": true, \"am\": 30, \"pm\": 10, \"note\": \"\u0e40\u0e1e\u0e34\u0e48\u0e21\u0e04\u0e34\u0e27 \u0e41\u0e04\u0e21\u0e40\u0e1b\u0e0d\u0e1b\u0e35\u0e43\u0e2b\u0e21\u0e48\"}};\n  const LEAD = 2;\n  const WD = ['\u0e2d\u0e32\u0e17\u0e34\u0e15\u0e22\u0e4c','\u0e08\u0e31\u0e19\u0e17\u0e23\u0e4c','\u0e2d\u0e31\u0e07\u0e04\u0e32\u0e23','\u0e1e\u0e38\u0e18','\u0e1e\u0e24\u0e2b\u0e31\u0e2a\u0e1a\u0e14\u0e35','\u0e28\u0e38\u0e01\u0e23\u0e4c','\u0e40\u0e2a\u0e32\u0e23\u0e4c'];\n  const s = this.state || {};\n  const mode = s.mode ?? (this.props.mode || 'week');\n  const week = s.week || [\n    {on: false, am: 0, pm: 0}, {on: true, am: 20, pm: 10}, {on: true, am: 20, pm: 10}, {on: true, am: 20, pm: 10},\n    {on: true, am: 20, pm: 10}, {on: true, am: 20, pm: 10}, {on: false, am: 0, pm: 0}];\n  const over = s.over || OVER0;\n  const sel = s.sel ?? 17;\n  const setW = (i, patch) => this.setState({week: week.map((w, j) => j === i ? {...w, ...patch} : w)});\n  const num = (e) => Math.max(0, parseInt(e.target.value || '0', 10) || 0);\n  const weekRows = week.map((w, i) => ({\n    name: WD[i], on: w.on, off: !w.on, am: w.am, pm: w.pm, total: w.on ? w.am + w.pm : 0,\n    rowSt: w.on ? '' : 'opacity:.55', sw: w.on ? 'background:#2E8540' : 'background:#C3CAD8', knob: w.on ? 'left:16px' : 'left:2px',\n    toggle: () => setW(i, {on: !w.on}),\n    setAm: (e) => setW(i, {am: num(e)}), setPm: (e) => setW(i, {pm: num(e)}),\n  }));\n  const weekTotal = weekRows.reduce((a, r) => a + r.total, 0);\n  const dayCfg = (d) => {\n    if (over[d]) return {...over[d], custom: true};\n    const w = week[(LEAD + d - 1) % 7];\n    return {on: w.on, am: w.on ? w.am : 0, pm: w.on ? w.pm : 0, custom: false, note: ''};\n  };\n  const cells = [];\n  for (let i = 0; i < LEAD; i++) cells.push({blank: true, show: false});\n  for (let d = 1; d <= 31; d++) {\n    const c = dayCfg(d); const b = BOOK[d] || [0, 0]; const q = c.am + c.pm; const bk = b[0] + b[1];\n    const full = c.on && q > 0 && bk >= q; const isSel = d === sel;\n    let st = 'font:inherit;width:100%;min-height:76px;border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left;';\n    st += isSel ? 'border:2px solid #2F5BEA;background:#F2F6FF;' : (c.on ? 'border:1px solid #E3E8F2;background:#fff;' : 'border:1px dashed #D5DCE8;background:#F6F7FA;');\n    cells.push({blank: false, show: true, d, st, on: c.on, off: !c.on, custom: c.custom,\n      q: q + ' \u0e04\u0e34\u0e27', bk: '\u0e08\u0e2d\u0e07 ' + bk, full, open: c.on && !full,\n      pick: () => this.setState({sel: d}),\n      mst: 'font:inherit;width:100%;height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0;color:#14215A;' + (isSel ? 'border:2px solid #2F5BEA;background:#F2F6FF;' : (c.on ? 'border:1px solid #E3E8F2;background:#fff;' : 'border:1px dashed #D5DCE8;background:#F6F7FA;color:#A0A8BA;')),\n      sub: !c.on ? '\u0e1b\u0e34\u0e14' : (full ? '\u0e40\u0e15\u0
